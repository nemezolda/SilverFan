<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Silverfan — Контакт</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #eef4ff, #dbe8ff);
            color: #1f2937;
        }

        .card {
            width: min(90%, 500px);
            padding: 40px 30px;
            text-align: center;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.12);
        }

        h1 {
            margin: 0 0 20px;
            font-size: 28px;
            color: #111827;
        }

        p {
            margin: 0 0 30px;
            font-size: 18px;
            line-height: 1.6;
            color: #4b5563;
        }

        .button {
            display: inline-block;
            padding: 14px 32px;
            border-radius: 12px;
            background: #229ed9;
            color: white;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
            transition: 0.2s ease;
            box-shadow: 0 6px 15px rgba(34, 158, 217, 0.3);
        }

        .button:hover {
            background: #168ac0;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(34, 158, 217, 0.4);
        }

        .button:active {
            transform: translateY(0);
        }
    </style>
</head>

<body>

    <div class="card">
        <h2>Увага.На цій строрінці ви можете написати адміністратору каналу Silverfan.</h2>
</br>
<h2>Усі інші контакти це ШАХРАЇ. Будьте обережні.</h2>
        <p>
            Для контакту з адміністратором каналу Silverfan
            натисніть на кнопку «Написати».
        </p>

        <a
            class="button"
            href="https://t.me/Nemezolda"
            target="_blank"
            rel="noopener noreferrer"
        >
            ✈ Написати
        </a>
    </div>

</body>
</html>
